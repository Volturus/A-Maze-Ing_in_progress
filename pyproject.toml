[tool.poetry]
name = "mazegen"
version = "1.0.0"
description = "Reusable Hunt-and-Kill maze generator with optional '42' pattern"
authors = ["mgrodeco, vmourey"]
license = "MIT"
readme = "README.md"
packages = [{ include = "mazegen" }]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
flake8 = "*"
mypy  = "*"

[build-system]
requires      = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"